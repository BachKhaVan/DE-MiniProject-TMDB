services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-labuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
    - pg_data:/var/lib/postgresql/data
    - ./postgres/init/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

  mage:
    image: mageai/mageai:latest
    container_name: mage
    ports:
      - "6789:6789"
    volumes:
      - .:/home/src
    environment:
      USER_CODE_PATH: /home/src/mage_pipeline
    depends_on:
      - postgres

volumes:
  pg_data:
  